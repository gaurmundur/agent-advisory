services:
  eyebrow: "Þjónusta"
  heading: "Þrír hlutir sem ráða því hvort gervigreindin skilar einhverju"
  agents:
    kicker: "// smíði"
    heading: "Fulltrúar og undirfulltrúar"
    body: "Eitt spjall við gervigreind dugar skammt þegar verkið er stórt. Ég smíða gervigreindarfulltrúa (e. AI agents) sem vinna sjálfir með verkfærin og kerfin ykkar. Þeir taka við verkefni, skipta því niður og senda hvern hluta á undirfulltrúa sem er sérhæfður í akkúrat því."
    points:
      - "Hver undirfulltrúi fær bara það samhengi og þau verkfæri sem hann þarf"
      - "Aðalfulltrúinn safnar saman og skilar einni niðurstöðu"
      - "Þú sérð hvað hver hluti gerði og getur lagað hann sérstaklega"
    tree:
      comment: "# skýrsla vikunnar"
      root: "aðalfulltrúi"
      steps:
        - { name: "sækja-gögn", note: "les kerfin" }
        - { name: "greina", note: "finnur breytingar" }
        - { name: "skrifa", note: "fyrstu drög" }
        - { name: "yfirfara", note: "athugar tölur og tón" }
      result: "→ ein skýrsla, tilbúin á mánudegi"
  setup:
    kicker: "// uppsetning"
    heading: "Rétt gervigreind og rétt færni"
    body: "Líkönin eru ólík að getu, hraða og verði. Ég vel það sem passar verkefninu og set upp færni (e. skills) og tengingar svo gervigreindin vinni í þínum gögnum og þínum kerfum, en ekki bara í tómum spjallglugga."
    matches:
      - {
          task: "Flókin greining og ákvarðanir",
          kind: "Líkan",
          fit: "Stærra líkan sem fær tíma til að hugsa",
        }
      - { task: "Mörg smá og endurtekin verk", kind: "Líkan", fit: "Hraðvirkt og ódýrt líkan" }
      - {
          task: "Vinna eftir ykkar verklagi",
          kind: "Færni",
          fit: "Leiðbeiningar, sniðmát og skriftur sem gervigreindin sækir þegar verkið kallar á þær",
        }
      - {
          task: "Aðgangur að ykkar kerfum",
          kind: "Tengingar",
          fit: "Beinar tengingar við gögnin ykkar",
        }
    caption: "Dæmi um hvernig verkefni og uppsetning eru pöruð saman."
  training:
    kicker: "// þjálfun"
    heading: "Að tala við gervigreindina"
    body: "Munurinn á lélegu og góðu svari liggur oftast í fyrirmælunum. Ég þjálfa þig og teymið þitt í að gefa hlutverk, samhengi og skýran ramma, með ykkar eigin verkefnum sem æfingu."
    points:
      - "Vinnustofur fyrir teymi frá 2 klst, líka fyrir fólk sem er ekki í tækni"
      - "Fyrirmælasafn fyrir verkefnin sem þið vinnið oftast"
    prompt:
      beforeLabel: "Áður"
      before: "Skrifaðu tölvupóst til viðskiptavinar."
      afterLabel: "Eftir"
      # **text** is highlighted
      after: "Viðskiptavinur kvartaði yfir að sendingin hans tafðist um viku. **Skrifaðu stutt svar** á íslensku. **Biðstu afsökunar einu sinni**, bjóddu nýja afhendingardagsetningu og hafðu tóninn hlýjan en faglegan. **Hámark 120 orð.**"
  also:
    label: "Líka:"
    text: "Ég smíða og bæti vefkerfi, greini gögn svo þau nýtist í ákvörðunum og finn leiðir til að einfalda og hagræða í rekstri."
