about:
  eyebrow: "Um mig"
  portraitAlt: "Svarthvít mynd af Hjalta brosandi með krosslagðar hendur"
  quote: "Ég er hugbúnaðarverkfræðingur sem hefur gaman af því að útskýra tækni fyrir fólki."
  bio: "Ég heiti Hjalti. Ég hef smíðað vef- og hugbúnaðarlausnir í meira en tíu ár, leitt þróunarteymi og kennt forritun fólki sem kemur ekki endilega úr tæknigeiranum. Í dag hjálpa ég fyrirtækjum og einstaklingum að koma gervigreind í gagnið í daglegum rekstri, með lausnum sem fólk skilur og treystir."
  facts:
    - { value: "10+", label: "ár í hugbúnaðarþróun" }
    - { value: "3", label: "tungumál sem ég vinn á" }
    - { value: "2022", label: "kenni forritun síðan" }
faq:
  eyebrow: "Spurningar"
  heading: "Algengar spurningar"
  items:
    - question: "Þarf ég að kunna eitthvað í tækni?"
      answer: "Nei. Ég hef kennt fólki sem hefur aldrei forritað og legg áherslu á að þú skiljir hvað kerfið gerir og af hverju."
    - question: "Við erum nú þegar með ChatGPT eða Copilot. Getur þú hjálpað?"
      answer: "Já. Ég vinn með þeim lausnum sem þið eruð með og kenni ykkur að nýta þær betur. Ef önnur lausn hentar betur segi ég þér það, en það er aldrei skilyrði."
    - question: "Hvað kostar gervigreindin sjálf?"
      answer: "Oftast nokkur þúsund krónur á mánuði á hvern notanda. Ég hjálpa ykkur að velja áskrift sem passar, svo þið borgið ekki fyrir meira en þið notið."
    - question: "Hvað með gögnin okkar?"
      answer: "Við förum yfir hvaða gögn gervigreindin fær að sjá áður en nokkuð er sett upp, og ég stilli aðgang þannig að hún nái bara í það sem hún þarf."
    - question: "Hentar þetta litlum fyrirtækjum?"
      answer: "Já. Oft er mesti ávinningurinn hjá litlum teymum þar sem fáir sinna mörgum verkum."
