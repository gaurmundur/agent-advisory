about:
  eyebrow: "Um mig"
  portraitAlt: "Svarthvít mynd af Hjalta brosandi með krosslagðar hendur"
  quote: "Ég er hugbúnaðarverkfræðingur sem hefur gaman af því að útskýra tækni fyrir fólki."
  bio: "Ég heiti Hjalti. Ég hef smíðað vef- og hugbúnaðarlausnir í meira en tíu ár, leitt þróunarteymi og kennt forritun fólki sem kemur ekki endilega úr tæknigeiranum. Í dag hjálpa ég fyrirtækjum og einstaklingum að koma gervigreind í gagnið í daglegu starfi, með lausnum sem fólk skilur og treystir."
  facts:
    - { value: "10+", label: "ár í hugbúnaðarþróun" }
    - { value: "Teymi", label: "leitt þróunarteymi" }
    - { value: "2022", label: "kenni forritun síðan" }
faq:
  eyebrow: "Spurningar"
  heading: "Algengar spurningar"
  items:
    - question: "Þarf ég að kunna eitthvað í tækni?"
      answer: "Nei. Ég hef kennt fólki sem hefur aldrei forritað og legg áherslu á að þú skiljir hvað kerfið gerir og af hverju."
    - question: "Hvaða gervigreind notar þú?"
      answer: "Þá sem hentar verkefninu best. Ég vinn með helstu líkönunum á markaðnum og vel á milli þeirra eftir getu, hraða og kostnaði."
    - question: "Hvað með gögnin okkar?"
      answer: "Við förum yfir hvaða gögn gervigreindin fær að sjá áður en nokkuð er sett upp, og ég stilli aðgang þannig að hún nái bara í það sem hún þarf."
    - question: "Hentar þetta litlum fyrirtækjum?"
      answer: "Já. Oft er mesti ávinningurinn hjá litlum teymum þar sem fáir sinna mörgum verkum."
