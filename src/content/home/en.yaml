services:
  eyebrow: "Services"
  heading: "Three ways to let AI save you time"
  agents:
    kicker: "// automation"
    heading: "Work that runs itself"
    body: "A lot of business admin is the same work over and over: sorting invoices, checking timesheets, summarising project status or reading job applications. I set up automated assistants (AI agents) that do this work inside your systems. A big job is split into parts, and each part goes to an assistant that knows exactly that."
    points:
      - "You decide what it can see and do, and it asks before anything is sent or booked"
      - "You get one summary, not ten windows"
      - "You can see what each part did and fix it on its own"
    tree:
      comment: "# month-end"
      root: "assistant"
      steps:
        - { name: "invoices", note: "fetches from email, sorts" }
        - { name: "bank", note: "matches transactions" }
        - { name: "payroll", note: "checks timesheets" }
        - { name: "review", note: "flags what doesn't add up" }
      result: "→ books and payroll ready to approve"
  setup:
    kicker: "// setup"
    heading: "Connected to the systems you use"
    body: "AI is most useful when it works with your data, not just in an empty chat window. I set up the solution that fits, whether you use ChatGPT, Copilot, Gemini or Claude, and connect it to your accounting, payroll, project management and email. I also pick the right version for each task, so you don't overpay for simple work."
    matches:
      - {
          task: "Accounting",
          kind: "Connection",
          fit: "Reads invoices, sorts them and matches them to the bank",
        }
      - {
          task: "Payroll",
          kind: "Review",
          fit: "Checks timesheets and exceptions before the pay run",
        }
      - {
          task: "Project management",
          kind: "Summary",
          fit: "Sends project status and next steps every week",
        }
      - {
          task: "Hiring",
          kind: "Your process",
          fit: "Reads applications and compares them with your requirements",
        }
    caption: "Examples of work AI can take on once it is connected properly."
  training:
    kicker: "// teaching"
    heading: "Training for you and your team"
    body: "Most people use only a fraction of what AI can do. I teach you the tool you already have, on your computer or your phone, and how to ask so the answer is actually useful. We practise on your own work."
    points:
      - "Team workshops from 2 hours, for people who are not technical"
      - "Ready-made prompts for the tasks you do most often"
    prompt:
      beforeLabel: "Before"
      before: "Write an email to a customer."
      afterLabel: "After"
      # **text** is highlighted
      after: "A customer complained that their delivery was a week late. **Write a short reply** in English. **Apologise once**, offer a new delivery date and keep the tone warm but professional. **120 words maximum.**"
  also:
    label: "Also:"
    text: "I build and improve web systems, analyse data so it supports decisions, and find ways to simplify and streamline operations."
