services:
  eyebrow: "Services"
  heading: "Three things that decide whether AI actually delivers"
  agents:
    kicker: "// build"
    heading: "Agents and subagents"
    body: "A single chat with an AI only goes so far when the job is big. I build agents that work directly with your tools and systems. They take a task, break it down and hand each part to a subagent that specialises in exactly that."
    points:
      - "Each subagent gets only the context and tools it needs"
      - "The main agent pulls it together and returns one result"
      - "You can see what each part did and fix it on its own"
    tree:
      comment: "# weekly report"
      root: "main agent"
      steps:
        - { name: "fetch-data", note: "reads the systems" }
        - { name: "analyse", note: "finds what changed" }
        - { name: "draft", note: "first draft" }
        - { name: "review", note: "checks numbers and tone" }
      result: "→ one report, ready on Monday"
  setup:
    kicker: "// setup"
    heading: "The right AI and the right skills"
    body: "Models differ in capability, speed and price. I pick the one that fits the task and set up skills and connections so the AI works with your data and your systems, not just in an empty chat window."
    matches:
      - {
          task: "Complex analysis and decisions",
          kind: "Model",
          fit: "A larger model given time to think",
        }
      - { task: "Many small, repetitive tasks", kind: "Model", fit: "A fast, low-cost model" }
      - {
          task: "Following your way of working",
          kind: "Skills",
          fit: "Instructions, templates and scripts the AI loads when a task calls for them",
        }
      - {
          task: "Access to your systems",
          kind: "Connections",
          fit: "Direct connections to your data (MCP)",
        }
    caption: "Examples of how tasks are matched with a setup."
  training:
    kicker: "// training"
    heading: "Talking to the AI"
    body: "The difference between a poor answer and a good one usually comes down to the instructions. I train you and your team to give the AI a role, context and clear limits, using your own work as practice."
    points:
      - "Team workshops from 2 hours, including for people who are not technical"
      - "A prompt library for the tasks you do most often"
    prompt:
      beforeLabel: "Before"
      before: "Write an email to a customer."
      afterLabel: "After"
      # **text** is highlighted
      after: "A customer complained that their delivery was a week late. **Write a short reply** in English. **Apologise once**, offer a new delivery date and keep the tone warm but professional. **120 words maximum.**"
  also:
    label: "Also:"
    text: "I build and improve web systems, analyse data so it supports decisions, and find ways to simplify and streamline operations."
