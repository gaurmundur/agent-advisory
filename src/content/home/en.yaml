about:
  eyebrow: "About"
  portraitAlt: "Black-and-white portrait of Hjalti smiling with his arms crossed"
  quote: "I’m a software engineer who enjoys explaining technology to people."
  bio: "I’m Hjalti. I have built web and software products for more than ten years, led development teams and taught programming to people who don’t necessarily come from tech. Today I help companies and individuals put AI to work in their daily jobs, with solutions people understand and trust."
  facts:
