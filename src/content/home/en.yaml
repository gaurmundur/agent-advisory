faq:
  eyebrow: "Questions"
  heading: "Common questions"
  items:
    - question: "Do I need to know anything technical?"
      answer: "No. I have taught people who have never written code, and I make sure you understand what the system does and why."
    - question: "We already have ChatGPT or Copilot. Can you help?"
      answer: "Yes. I work with the tools you already have and teach you to get more out of them. If another tool would suit you better I’ll tell you, but it’s never a requirement."
    - question: "What does the AI itself cost?"
      answer: "Usually 20 to 30 US dollars per user per month. I help you pick a plan that fits, so you don’t pay for more than you use."
    - question: "What about our data?"
      answer: "We go through which data the AI is allowed to see before anything is set up, and I configure access so it only reaches what it needs."
    - question: "Is this a fit for small businesses?"
      answer: "Yes. The biggest gains are often in small teams where a few people handle many tasks."
