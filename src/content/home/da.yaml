about:
  eyebrow: "Om mig"
  portraitAlt: "Sort-hvidt portræt af Hjalti, der smiler med armene over kors"
  quote: "Jeg er softwareingeniør og kan godt lide at forklare teknologi for folk."
  bio: "Jeg hedder Hjalti. Jeg har bygget web- og softwareløsninger i mere end ti år, ledet udviklingsteams og undervist i programmering for folk, der ikke nødvendigvis kommer fra tech. I dag hjælper jeg virksomheder og enkeltpersoner med at tage AI i brug i den daglige drift, med løsninger folk forstår og stoler på."
  facts:
    - { value: "10+", label: "år med softwareudvikling" }
    - { value: "3", label: "sprog jeg arbejder på" }
    - { value: "2022", label: "underviser i programmering siden" }
faq:
  eyebrow: "Spørgsmål"
  heading: "Ofte stillede spørgsmål"
  items:
    - question: "Skal jeg kunne noget teknisk?"
      answer: "Nej. Jeg har undervist folk, der aldrig har programmeret, og sørger for, at du forstår, hvad systemet gør og hvorfor."
    - question: "Vi har allerede ChatGPT eller Copilot. Kan du hjælpe?"
      answer: "Ja. Jeg arbejder med de værktøjer, I har, og lærer jer at få mere ud af dem. Hvis et andet værktøj passer bedre, siger jeg det, men det er aldrig et krav."
    - question: "Hvad koster selve AI’en?"
      answer: "Typisk omkring 150 til 250 kr. om måneden pr. bruger. Jeg hjælper jer med at vælge et abonnement, der passer, så I ikke betaler for mere, end I bruger."
    - question: "Hvad med vores data?"
      answer: "Vi gennemgår, hvilke data AI’en må se, før noget bliver sat op, og jeg indstiller adgangen, så den kun når det, den har brug for."
    - question: "Passer det til små virksomheder?"
      answer: "Ja. Den største gevinst er ofte i små teams, hvor få personer klarer mange opgaver."
