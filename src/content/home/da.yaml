services:
  eyebrow: "Ydelser"
  heading: "Tre måder at lade AI spare dig tid"
  agents:
    kicker: "// automatisering"
    heading: "Opgaver der klarer sig selv"
    body: "I driften bliver mange opgaver gjort igen og igen: at sortere fakturaer, tjekke timeregistrering, opsummere status på projekter eller læse ansøgninger igennem. Jeg sætter automatiske assistenter (AI-agenter) op, der klarer opgaverne i jeres systemer. En stor opgave bliver delt op, og hver del går til en assistent, der kan netop det."
    points:
      - "Du bestemmer, hvad den må se og gøre, og den spørger, før noget bliver sendt eller bogført"
      - "Du får ét overblik, ikke ti vinduer"
      - "Du kan se, hvad hver del gjorde, og rette den for sig"
    tree:
      comment: "# månedsafslutning"
      root: "assistent"
      steps:
        - { name: "fakturaer", note: "henter fra mail, sorterer" }
        - { name: "bank", note: "afstemmer posteringer" }
        - { name: "løn", note: "tjekker timer" }
        - { name: "kontrol", note: "markerer det, der ikke stemmer" }
      result: "→ bogføring og løn klar til godkendelse"
  setup:
    kicker: "// opsætning"
    heading: "Koblet på de systemer, I bruger"
    body: "AI gør mest gavn, når den arbejder med jeres data og ikke kun i et tomt chatvindue. Jeg sætter den løsning op, der passer, uanset om I bruger ChatGPT, Copilot, Gemini eller Claude, og kobler den på bogføringen, lønsystemet, projektstyringen og mailen. Jeg vælger også den version, der passer til hver opgave, så I ikke betaler for meget for simple opgaver."
    matches:
      - {
          task: "Bogføring",
          kind: "Integration",
          fit: "Læser fakturaer, sorterer dem og afstemmer med banken",
        }
      - {
          task: "Løn",
          kind: "Kontrol",
          fit: "Tjekker timeregistrering og afvigelser før lønkørslen",
        }
      - { task: "Projektstyring", kind: "Overblik", fit: "Sender status og næste skridt hver uge" }
      - {
          task: "Rekruttering",
          kind: "Jeres metode",
          fit: "Læser ansøgninger og sammenligner med jeres krav",
        }
    caption: "Eksempler på opgaver, AI kan tage sig af, når den er koblet rigtigt på."
  training:
    kicker: "// undervisning"
    heading: "Undervisning for dig og dit team"
    body: "De fleste bruger kun en brøkdel af, hvad AI kan. Jeg lærer jer det værktøj, I allerede har, på computeren eller telefonen, og hvordan I spørger, så svaret kan bruges. Vi øver os på jeres egne opgaver."
    points:
      - "Workshops for teams fra 2 timer, for folk uden teknisk baggrund"
      - "Færdige prompts til de opgaver, I laver oftest"
    prompt:
      beforeLabel: "Før"
      before: "Skriv en e-mail til en kunde."
      afterLabel: "Efter"
      # **text** is highlighted
      after: "En kunde har klaget over, at leveringen var en uge forsinket. **Skriv et kort svar** på dansk. **Undskyld én gang**, tilbyd en ny leveringsdato, og hold tonen varm men professionel. **Højst 120 ord.**"
  also:
    label: "Også:"
    text: "Jeg bygger og forbedrer websystemer, analyserer data, så de kan bruges til beslutninger, og finder måder at forenkle og effektivisere driften på."
