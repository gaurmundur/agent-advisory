services:
  eyebrow: "Ydelser"
  heading: "Tre ting der afgør, om AI faktisk leverer"
  agents:
    kicker: "// udvikling"
    heading: "Agenter og subagenter"
    body: "En enkelt chat med en AI rækker ikke langt, når opgaven er stor. Jeg bygger agenter, der arbejder direkte med jeres værktøjer og systemer. De tager en opgave, deler den op og giver hver del til en subagent, der er specialiseret i netop det."
    points:
      - "Hver subagent får kun den kontekst og de værktøjer, den har brug for"
      - "Hovedagenten samler det hele og returnerer ét resultat"
      - "Du kan se, hvad hver del gjorde, og rette den for sig"
    tree:
      comment: "# ugens rapport"
      root: "hovedagent"
      steps:
        - { name: "hent-data", note: "læser systemerne" }
        - { name: "analysér", note: "finder ændringer" }
        - { name: "skriv", note: "første udkast" }
        - { name: "gennemgå", note: "tjekker tal og tone" }
      result: "→ én rapport, klar mandag"
  setup:
    kicker: "// opsætning"
    heading: "Den rigtige AI og de rigtige skills"
    body: "Modellerne er forskellige i evne, hastighed og pris. Jeg vælger den, der passer til opgaven, og sætter skills og forbindelser op, så AI’en arbejder med jeres data og jeres systemer og ikke kun i et tomt chatvindue."
    matches:
      - {
          task: "Kompleks analyse og beslutninger",
          kind: "Model",
          fit: "En større model, der får tid til at tænke",
        }
      - { task: "Mange små, gentagne opgaver", kind: "Model", fit: "En hurtig og billig model" }
      - {
          task: "Arbejde efter jeres metoder",
          kind: "Skills",
          fit: "Instruktioner, skabeloner og scripts, som AI’en henter, når opgaven kræver det",
        }
      - {
          task: "Adgang til jeres systemer",
          kind: "Forbindelser",
          fit: "Direkte forbindelser til jeres data (MCP)",
        }
    caption: "Eksempler på, hvordan opgaver matches med en opsætning."
  training:
    kicker: "// træning"
    heading: "At tale med AI’en"
    body: "Forskellen på et dårligt og et godt svar ligger oftest i instruktionerne. Jeg træner dig og dit team i at give AI’en en rolle, kontekst og klare rammer, med jeres egne opgaver som øvelse."
    points:
      - "Workshops for teams fra 2 timer, også for folk uden teknisk baggrund"
      - "Et bibliotek af prompts til de opgaver, I laver oftest"
    prompt:
      beforeLabel: "Før"
      before: "Skriv en e-mail til en kunde."
      afterLabel: "Efter"
      # **text** is highlighted
      after: "En kunde har klaget over, at leveringen var en uge forsinket. **Skriv et kort svar** på dansk. **Undskyld én gang**, tilbyd en ny leveringsdato, og hold tonen varm men professionel. **Højst 120 ord.**"
  also:
    label: "Også:"
    text: "Jeg bygger og forbedrer websystemer, analyserer data, så de kan bruges til beslutninger, og finder måder at forenkle og effektivisere driften på."
