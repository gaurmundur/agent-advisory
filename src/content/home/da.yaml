about:
  eyebrow: "Om mig"
  portraitAlt: "Sort-hvidt portræt af Hjalti, der smiler med armene over kors"
  quote: "Jeg er softwareingeniør og kan godt lide at forklare teknologi for folk."
  bio: "Jeg hedder Hjalti. Jeg har bygget web- og softwareløsninger i mere end ti år, ledet udviklingsteams og undervist i programmering for folk, der ikke nødvendigvis kommer fra tech. I dag hjælper jeg virksomheder og enkeltpersoner med at tage AI i brug i deres daglige arbejde, med løsninger folk forstår og stoler på."
  facts:
    - { value: "10+", label: "år med softwareudvikling" }
    - { value: "Teams", label: "har ledet udviklingsteams" }
    - { value: "2022", label: "underviser i programmering siden" }
faq:
  eyebrow: "Spørgsmål"
  heading: "Ofte stillede spørgsmål"
  items:
    - question: "Skal jeg kunne noget teknisk?"
      answer: "Nej. Jeg har undervist folk, der aldrig har programmeret, og sørger for, at du forstår, hvad systemet gør og hvorfor."
    - question: "Hvilken AI bruger du?"
      answer: "Den, der passer bedst til opgaven. Jeg arbejder med de førende modeller på markedet og vælger mellem dem ud fra evne, hastighed og pris."
    - question: "Hvad med vores data?"
      answer: "Vi gennemgår, hvilke data AI’en må se, før noget bliver sat op, og jeg indstiller adgangen, så den kun når det, den har brug for."
    - question: "Passer det til små virksomheder?"
      answer: "Ja. Den største gevinst er ofte i små teams, hvor få personer klarer mange opgaver."
