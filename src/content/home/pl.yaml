    heading: "Jak rozmawiać z AI"
    body: "Różnica między słabą a dobrą odpowiedzią zwykle tkwi w instrukcjach. Uczę Ciebie i Twój zespół, jak nadać AI rolę, kontekst i jasne ramy, ćwicząc na Waszych własnych zadaniach."
