about:
  eyebrow: "O mnie"
  portraitAlt: "Czarno-białe zdjęcie Hjaltiego, uśmiechniętego, z założonymi rękami"
  quote: "Jestem inżynierem oprogramowania i lubię tłumaczyć ludziom technologię."
  bio: "Nazywam się Hjalti. Od ponad dziesięciu lat tworzę rozwiązania webowe i oprogramowanie, kierowałem zespołami programistów i uczyłem programowania osoby, które niekoniecznie wywodzą się z branży IT. Dziś pomagam firmom i osobom prywatnym wykorzystywać AI w codziennej pracy, dzięki rozwiązaniom, które ludzie rozumieją i którym ufają."
  facts:
