    heading: "Właściwa AI i właściwe skills"
    body: "Modele różnią się możliwościami, szybkością i ceną. Wybieram ten, który pasuje do zadania, i konfiguruję skills oraz połączenia, żeby AI pracowała na Waszych danych i w Waszych systemach, a nie tylko w pustym oknie czatu."
