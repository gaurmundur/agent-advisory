about:
  eyebrow: "O mnie"
  portraitAlt: "Czarno-białe zdjęcie Hjaltiego, uśmiechniętego, z założonymi rękami"
  quote: "Jestem inżynierem oprogramowania i lubię tłumaczyć ludziom technologię."
  bio: "Nazywam się Hjalti. Od ponad dziesięciu lat tworzę rozwiązania webowe i oprogramowanie, kierowałem zespołami programistów i uczyłem programowania osoby, które niekoniecznie wywodzą się z branży IT. Dziś pomagam firmom i osobom prywatnym wykorzystywać AI w codziennej działalności, dzięki rozwiązaniom, które ludzie rozumieją i którym ufają."
  facts:
    - { value: "10+", label: "lat w tworzeniu oprogramowania" }
    - { value: "Zespoły", label: "kierowałem zespołami programistów" }
    - { value: "2022", label: "uczę programowania od" }
faq:
  eyebrow: "Pytania"
  heading: "Najczęstsze pytania"
  items:
    - question: "Czy trzeba znać się na technologii?"
      answer: "Nie. Uczyłem osoby, które nigdy nie programowały, i dbam o to, żeby było jasne, co robi system i dlaczego."
    - question: "Mamy już ChatGPT albo Copilota. Czy możesz pomóc?"
      answer: "Tak. Pracuję z narzędziami, które już macie, i uczę, jak wyciągnąć z nich więcej. Jeśli inne narzędzie pasuje lepiej, powiem o tym, ale to nigdy nie jest warunek."
    - question: "Ile kosztuje sama AI?"
      answer: "Zwykle około 80–120 zł miesięcznie na użytkownika. Pomagam wybrać abonament, który pasuje, żebyście nie płacili za więcej, niż używacie."
    - question: "A co z naszymi danymi?"
      answer: "Zanim cokolwiek skonfigurujemy, ustalamy, które dane AI może widzieć, a ja ustawiam dostęp tak, żeby sięgała tylko po to, czego potrzebuje."
    - question: "Czy to się sprawdzi w małej firmie?"
      answer: "Tak. Największe korzyści często widać w małych zespołach, w których kilka osób zajmuje się wieloma zadaniami."
