  agents:
    kicker: "// budowa"
    heading: "Agenci i subagenci"
    body: "Jedna rozmowa z AI nie wystarczy, gdy zadanie jest duże. Buduję agentów, którzy pracują bezpośrednio z Waszymi narzędziami i systemami. Przyjmują zadanie, dzielą je na części i przekazują każdą z nich subagentowi wyspecjalizowanemu właśnie w tym."
