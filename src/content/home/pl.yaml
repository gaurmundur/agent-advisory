    - { value: "Zespoły", label: "kierowałem zespołami programistów" }
    - { value: "2022", label: "uczę programowania od" }
faq:
  eyebrow: "Pytania"
  heading: "Najczęstsze pytania"
  items:
    - question: "Czy trzeba znać się na technologii?"
      answer: "Nie. Uczyłem osoby, które nigdy nie programowały, i dbam o to, żeby było jasne, co robi system i dlaczego."
    - question: "Jakiej AI używasz?"
      answer: "Takiej, która najlepiej pasuje do zadania. Pracuję z wiodącymi modelami na rynku i wybieram między nimi według możliwości, szybkości i kosztów."
    - question: "A co z naszymi danymi?"
      answer: "Zanim cokolwiek skonfigurujemy, ustalamy, które dane AI może widzieć, a ja ustawiam dostęp tak, żeby sięgała tylko po to, czego potrzebuje."
    - question: "Czy to się sprawdzi w małej firmie?"
      answer: "Tak. Największe korzyści często widać w małych zespołach, w których kilka osób zajmuje się wieloma zadaniami."
