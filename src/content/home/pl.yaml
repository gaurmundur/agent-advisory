        - { name: "analizuj", note: "znajduje zmiany" }
        - { name: "napisz", note: "pierwsza wersja" }
        - { name: "sprawdź", note: "sprawdza liczby i ton" }
      result: "→ jeden raport, gotowy w poniedziałek"
