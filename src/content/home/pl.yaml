services:
  eyebrow: "Usługi"
  heading: "Trzy sposoby, żeby AI oszczędzała Twój czas"
  agents:
    kicker: "// automatyzacja"
    heading: "Zadania, które wykonują się same"
    body: "W firmie wiele zadań powtarza się w kółko: sortowanie faktur, sprawdzanie ewidencji czasu pracy, podsumowanie stanu projektów czy przeglądanie aplikacji o pracę. Wdrażam automatycznych asystentów (agentów AI), którzy wykonują te zadania w Waszych systemach. Duże zadanie jest dzielone na części, a każda trafia do asystenta, który zna się właśnie na tym."
    points:
      - "Ty decydujesz, co asystent może widzieć i robić, a on pyta, zanim cokolwiek wyśle lub zaksięguje"
      - "Dostajesz jedno podsumowanie, a nie dziesięć okien"
      - "Widzisz, co zrobiła każda część, i możesz ją poprawić osobno"
    tree:
      comment: "# koniec miesiąca"
      root: "asystent"
      steps:
        - { name: "faktury", note: "pobiera z poczty, sortuje" }
        - { name: "bank", note: "uzgadnia transakcje" }
        - { name: "płace", note: "sprawdza czas pracy" }
        - { name: "kontrola", note: "oznacza, co się nie zgadza" }
      result: "→ księgi i płace gotowe do akceptacji"
  setup:
    kicker: "// wdrożenie"
    heading: "Połączone z systemami, których używacie"
    body: "AI daje najwięcej, gdy pracuje na Waszych danych, a nie tylko w pustym oknie czatu. Wdrażam rozwiązanie, które pasuje, niezależnie od tego, czy używacie ChatGPT, Copilota, Gemini czy Claude’a, i łączę je z księgowością, systemem płacowym, zarządzaniem projektami i pocztą. Dobieram też wersję do każdego zadania, żebyście nie przepłacali za proste prace."
    matches:
      - {
          task: "Księgowość",
          kind: "Integracja",
          fit: "Czyta faktury, sortuje je i uzgadnia z bankiem",
        }
      - {
          task: "Płace",
          kind: "Kontrola",
          fit: "Sprawdza czas pracy i odstępstwa przed naliczeniem płac",
        }
      - {
          task: "Zarządzanie projektami",
          kind: "Podsumowanie",
          fit: "Co tydzień wysyła stan projektów i kolejne kroki",
        }
      - {
          task: "Rekrutacja",
          kind: "Wasze zasady",
          fit: "Czyta aplikacje i porównuje je z Waszymi wymaganiami",
        }
    caption: "Przykłady zadań, które AI może przejąć, gdy jest dobrze połączona."
  training:
    kicker: "// szkolenia"
    heading: "Szkolenia dla Ciebie i zespołu"
    body: "Większość osób korzysta tylko z ułamka możliwości AI. Uczę Was obsługi narzędzia, które już macie, na komputerze lub telefonie, i tego, jak prosić, żeby odpowiedź była przydatna. Ćwiczymy na Waszych własnych zadaniach."
    points:
      - "Warsztaty dla zespołów od 2 godzin, dla osób spoza branży IT"
      - "Gotowe prompty do zadań, które wykonujecie najczęściej"
    prompt:
      beforeLabel: "Przed"
      before: "Napisz e-mail do klienta."
      afterLabel: "Po"
      # **text** is highlighted
      after: "Klient poskarżył się, że dostawa spóźniła się o tydzień. **Napisz krótką odpowiedź** po polsku. **Przeproś jeden raz**, zaproponuj nowy termin dostawy i zachowaj ciepły, ale profesjonalny ton. **Maksymalnie 120 słów.**"
  also:
    label: "Również:"
    text: "Tworzę i ulepszam systemy webowe, analizuję dane tak, by wspierały decyzje, i szukam sposobów na uproszczenie i usprawnienie działalności firmy."
